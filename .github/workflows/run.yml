name: Embodied AI Daily

on:
  schedule:
    # 09:30 Asia/Shanghai (GitHub cron uses UTC).
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      force_reprocess:
        description: Reprocess today even when data already exists
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: embodied-ai-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      TOKEN_GITHUB: ${{ github.token }}
      LANGUAGE: ${{ vars.LANGUAGE || 'Chinese' }}
      CATEGORIES: ${{ vars.CATEGORIES || 'cs.RO,cs.AI,cs.LG,cs.CV' }}
      MODEL_NAME: ${{ vars.MODEL_NAME || 'gpt-5.6-luna' }}
      REASONING_EFFORT: ${{ vars.REASONING_EFFORT || 'medium' }}
      AI_MAX_WORKERS: ${{ vars.AI_MAX_WORKERS || '6' }}
      AI_REQUEST_RETRIES: ${{ vars.AI_REQUEST_RETRIES || '3' }}
      AI_RETRY_BASE_SECONDS: ${{ vars.AI_RETRY_BASE_SECONDS || '2' }}
      AI_RETRY_MAX_SECONDS: ${{ vars.AI_RETRY_MAX_SECONDS || '60' }}
      AI_REQUEST_STAGGER_SECONDS: ${{ vars.AI_REQUEST_STAGGER_SECONDS || '0.5' }}
      TOPIC_FILTER_ENABLED: ${{ vars.TOPIC_FILTER_ENABLED || 'true' }}
      TOPIC_FILTER_MODEL_NAME: ${{ vars.TOPIC_FILTER_MODEL_NAME || vars.MODEL_NAME || 'gpt-5.6-luna' }}
      TOPIC_FILTER_MAX_WORKERS: ${{ vars.TOPIC_FILTER_MAX_WORKERS || '3' }}
      TOPIC_FILTER_MIN_CONFIDENCE: ${{ vars.TOPIC_FILTER_MIN_CONFIDENCE || '0.65' }}
      TOPIC_FILTER_KEEP_UNCERTAIN: ${{ vars.TOPIC_FILTER_KEEP_UNCERTAIN || 'false' }}
      TOPIC_FILTER_REQUEST_RETRIES: ${{ vars.TOPIC_FILTER_REQUEST_RETRIES || '3' }}
      TOPIC_FILTER_REQUEST_STAGGER_SECONDS: ${{ vars.TOPIC_FILTER_REQUEST_STAGGER_SECONDS || '0.5' }}
      SENSITIVE_CHECK_URL: ${{ vars.SENSITIVE_CHECK_URL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen

      - name: Validate configuration
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is not configured" >&2; exit 1; }
          test -n "$OPENAI_BASE_URL" || { echo "OPENAI_BASE_URL is not configured" >&2; exit 1; }
          printf 'Model: %s\nReasoning effort: %s\nAI workers: %s\nTopic workers: %s\n' \
            "$MODEL_NAME" "$REASONING_EFFORT" "$AI_MAX_WORKERS" "$TOPIC_FILTER_MAX_WORKERS"

      - name: Prepare run and recent history
        id: prepare
        env:
          FORCE_REPROCESS: ${{ inputs.force_reprocess }}
        run: |
          set -Eeuo pipefail
          today=$(date -u '+%Y-%m-%d')
          force_reprocess=${FORCE_REPROCESS:-false}
          mkdir -p data assets logs

          echo "date=$today" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --no-tags origin data:refs/remotes/origin/data

            if [ "$force_reprocess" != "true" ] && \
               git cat-file -e "origin/data:data/${today}_AI_enhanced_${LANGUAGE}.jsonl" 2>/dev/null; then
              echo "Today's enhanced data already exists; skipping. Use force_reprocess for a manual rerun."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            for offset in $(seq 1 7); do
              history_date=$(date -u -d "-${offset} day" '+%Y-%m-%d')
              history_path="data/${history_date}.jsonl"
              if git cat-file -e "origin/data:${history_path}" 2>/dev/null; then
                git show "origin/data:${history_path}" > "$history_path"
              fi
            done
          fi

      - name: Crawl arXiv
        if: steps.prepare.outputs.should_run == 'true'
        run: |
          set -Eeuo pipefail
          today=${{ steps.prepare.outputs.date }}
          rm -f "data/${today}.jsonl" "data/${today}_AI_enhanced_${LANGUAGE}.jsonl" "data/${today}.md"
          (
            cd daily_arxiv
            uv run scrapy crawl arxiv -o "../data/${today}.jsonl"
          )
          test -s "data/${today}.jsonl" || { echo "Crawler produced no data" >&2; exit 1; }

      - name: Deduplicate against recent papers
        id: deduplicate
        if: steps.prepare.outputs.should_run == 'true'
        run: |
          set +e
          (
            cd daily_arxiv
            uv run python daily_arxiv/check_stats.py
          )
          status=$?
          set -e

          case "$status" in
            0) echo "has_new_content=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "has_new_content=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Deduplication failed with exit code $status" >&2; exit "$status" ;;
          esac

      - name: Filter for embodied AI and robotics
        id: topic_filter
        if: steps.deduplicate.outputs.has_new_content == 'true'
        run: |
          set +e
          uv run python scripts/topic_filter.py --data "data/${{ steps.prepare.outputs.date }}.jsonl"
          status=$?
          set -e

          case "$status" in
            0) echo "has_relevant_content=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_relevant_content=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Topic filtering failed with exit code $status" >&2; exit "$status" ;;
          esac

      - name: Generate AI paper analysis
        if: steps.deduplicate.outputs.has_new_content == 'true' && steps.topic_filter.outputs.has_relevant_content == 'true'
        run: |
          (
            cd ai
            uv run python enhance.py \
              --data "../data/${{ steps.prepare.outputs.date }}.jsonl" \
              --max_workers "$AI_MAX_WORKERS"
          )
          test -s "data/${{ steps.prepare.outputs.date }}_AI_enhanced_${LANGUAGE}.jsonl" || {
            echo "AI enhancement produced no data" >&2
            exit 1
          }

      - name: Convert to Markdown
        if: steps.deduplicate.outputs.has_new_content == 'true' && steps.topic_filter.outputs.has_relevant_content == 'true'
        run: |
          (
            cd to_md
            uv run python convert.py \
              --data "../data/${{ steps.prepare.outputs.date }}_AI_enhanced_${LANGUAGE}.jsonl"
          )

      - name: Publish generated data
        if: steps.deduplicate.outputs.has_new_content == 'true' && steps.topic_filter.outputs.has_relevant_content == 'true'
        run: |
          set -Eeuo pipefail
          today=${{ steps.prepare.outputs.date }}
          publish_dir=$(mktemp -d)
          trap 'git worktree remove --force "$publish_dir" >/dev/null 2>&1 || true' EXIT

          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add --detach "$publish_dir" origin/data
          else
            git worktree add --detach "$publish_dir"
            (
              cd "$publish_dir"
              git checkout --orphan data
              git rm -rf --cached . >/dev/null 2>&1 || true
              find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
              mkdir -p data assets
              printf '# Embodied AI Daily data\n' > README.md
            )
          fi

          mkdir -p "$publish_dir/data" "$publish_dir/assets"
          cp "data/${today}.jsonl" "$publish_dir/data/"
          cp "data/${today}_AI_enhanced_${LANGUAGE}.jsonl" "$publish_dir/data/"
          cp "data/${today}.md" "$publish_dir/data/"

          (
            cd "$publish_dir"
            find data -maxdepth 1 -type f -name '*.jsonl' -printf '%f\n' | sort > assets/file-list.txt
            git config user.name "${{ vars.NAME || github.repository_owner }}"
            git config user.email "${{ vars.EMAIL || 'actions@github.com' }}"
            git add data assets/file-list.txt README.md 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Data branch is already up to date"
            else
              git commit -m "update: ${today} embodied AI papers"
              git push origin HEAD:data
            fi
          )

      - name: Notify incomplete AI analysis
        if: steps.deduplicate.outputs.has_new_content == 'true' && steps.topic_filter.outputs.has_relevant_content == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=$(grep -c '"tldr": "Summary generation failed"' \
            "data/${{ steps.prepare.outputs.date }}_AI_enhanced_${LANGUAGE}.jsonl" || true)
          if [ "$failed" -gt 0 ]; then
            gh issue create \
              --title "AI analysis incomplete: ${{ steps.prepare.outputs.date }}" \
              --body "$failed papers exhausted all AI request retries. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --assignee "${{ github.repository_owner }}"
            exit 1
          fi

      - name: Workflow summary
        if: always()
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.prepare.outputs.started_at || '0' }} ))
          {
            echo "## Embodied AI Daily"
            echo
            echo "- Date: ${{ steps.prepare.outputs.date || 'not started' }}"
            echo "- Processed: ${{ steps.prepare.outputs.should_run || 'false' }}"
            echo "- New content: ${{ steps.deduplicate.outputs.has_new_content || 'false' }}"
            echo "- Relevant content: ${{ steps.topic_filter.outputs.has_relevant_content || 'false' }}"
            echo "- Elapsed: $((elapsed / 60))m $((elapsed % 60))s"
            echo "- Model: $MODEL_NAME"
            echo "- Reasoning effort: $REASONING_EFFORT"
          } >> "$GITHUB_STEP_SUMMARY"
